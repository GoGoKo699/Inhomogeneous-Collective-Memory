name: Hosted mathematics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    name: Check rendered GitHub mathematics
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install temporary browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-math-deps" playwright@1.56.1 mathjax-full@3.2.1
          "$RUNNER_TEMP/hosted-math-deps/node_modules/.bin/playwright" install --with-deps chromium

      - name: Capture and compare all tracked Markdown pages
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          NODE_PATH: ${{ runner.temp }}/hosted-math-deps/node_modules
        run: |
          node verification/github_math/scripts/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$SOURCE_REPOSITORY" \
            --revision "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/hosted-math-evidence"

      - name: Retain the report and actual hosted captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-math-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/hosted-math-evidence/
          if-no-files-found: warn
          retention-days: 14
